name: Build and Release Mod
on:
  push:
    branches: [main]

jobs:
  buildJar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Install build-tools
      run: sdkmanager "build-tools;34.0.0"

    - name: Set up PATH
      run: echo "${ANDROID_HOME}/build-tools/34.0.0" >> "$GITHUB_PATH"

    - name: Read version from mod.hjson
      id: modver
      run: |
        VERSION=$(grep -oP '(?<=version:)\s*"?[^",\n]+' mod.hjson | tr -d '" ' | head -n1)
        if [ -z "$VERSION" ]; then
          echo "mod.hjson에서 version 값을 찾지 못했습니다."
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
        echo "감지된 버전: $VERSION (태그: v$VERSION)"

    - name: Check if tag already exists
      id: checktag
      run: |
        if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.modver.outputs.tag }}$"; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "태그 ${{ steps.modver.outputs.tag }} 는 이미 존재합니다. 태그 생성은 스킵하고 빌드 결과물만 갱신합니다."
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build mod jar
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x ./gradlew
        ./gradlew deploy

    - name: Create and push tag
      if: steps.checktag.outputs.exists == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag ${{ steps.modver.outputs.tag }}
        git push origin ${{ steps.modver.outputs.tag }}

    - name: Create or Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.modver.outputs.tag }}
        files: build/libs/${{ github.event.repository.name }}.jar
        generate_release_notes: true
