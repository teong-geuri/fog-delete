apply plugin: "java"

sourceSets.main.java.srcDirs = ["src"]

//reads a "key: value" line out of mod.hjson; returns null if not found
def readHjsonField(String key){
    def source = file("mod.hjson").getText("UTF-8")
    def matcher = source =~ /(?m)^${key}:\s*"?([^",\n]+)"?\s*$/
    return matcher.find() ? matcher.group(1).trim() : null
}

ext{
    // Mindustry version to depend on.
    // Valid values:
    // - latest: depend on the latest release of mindustry
    // - be: depend on the very latest commit of mindustry
    // - v<number>: depend on a specific version
    // Defaults come from mod.hjson (minGameVersion / version) unless overridden with -P flags.
    mindustryVersion = findProperty("mindustryVersion") ?: "v${readHjsonField("minGameVersion") ?: "159.7"}"
    modVersion = findProperty("modVersion") ?: (readHjsonField("version") ?: "1.2.0")
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}

repositories{
    mavenCentral()

    //Downloads the dependencies JAR file from Mindustry releases; does not use any real repository. Surprisingly, this is the most reliable option.
    ivy{
        url = 'https://github.com/'
        patternLayout{ artifact(
            (mindustryVersion == "latest" ? '/[organisation]/[module]/releases/[revision]/download/dependencies.jar' : //latest stable release
            mindustryVersion == "be" ? '/[organisation]/[module]/releases/download/master/[revision].jar' : //latest commit (BE)
            '/[organisation]/[module]/releases/download/[revision]/dependencies.jar')) //specific release
        }
        metadataSources{ artifact() }

        content{
            if(mindustryVersion == "be"){
                //BE artifact version is always 'latest'
                includeVersion("Anuken", "MindustryBuilds", "latest")
            }else{
                includeVersion("Anuken", "Mindustry", mindustryVersion)
            }
        }
    }
}

java{
    targetCompatibility = JavaVersion.VERSION_17
    sourceCompatibility = JavaVersion.VERSION_17
}

dependencies{
    compileOnly mindustryVersion == "be" ? "Anuken:MindustryBuilds:latest" : "Anuken:Mindustry:$mindustryVersion"
}

def generatedModMetadata = layout.buildDirectory.file("generated/mod.hjson")

tasks.register("generateModMetadata"){
    outputs.file(generatedModMetadata)
    doLast{
        def source = file("mod.hjson").getText("UTF-8")
        def metadata = source.replaceFirst(/(?m)^version:\s*.+$/, "version: ${modVersion}")
        def output = generatedModMetadata.get().asFile
        output.parentFile.mkdirs()
        output.setText(metadata, "UTF-8")
    }
}

tasks.register('jarAndroid') {
    dependsOn "jar"
    def projectName = project.name

    doLast {
        if(!sdkRoot || !new File(sdkRoot).exists()) {
            throw new GradleException("No valid Android SDK found. Set ANDROID_HOME environment variable.")
        }

        // 최신 android.jar 찾기
        def platformRoot = new File("$sdkRoot/platforms/").listFiles()?.sort()?.reverse()?.find { f -> new File(f, "android.jar").exists() }
        if(!platformRoot) throw new GradleException("No android.jar found in SDK platforms directory.")

        // d8 실행 파일 경로를 명확히 추적
        def d8Executable = isWindows ? "d8.bat" : "d8"
        def buildToolsDir = new File("$sdkRoot/build-tools/").listFiles()?.sort()?.last()
        def d8File = buildToolsDir ? new File(buildToolsDir, d8Executable) : null

        def d8Path = (d8File && d8File.exists()) ? d8File.absolutePath : d8Executable

        // Desugaring에 필요한 Classpath 모으기
        def classpaths = (configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList() + [new File(platformRoot, "android.jar")])

        // Gradle 공식 exec 메서드로 안전하게 실행
        exec {
            def command = [d8Path]
            classpaths.each { command.addAll(["--classpath", it.path]) }
            // min-api를 26 이상으로 지정해야 Java 17 문법 및 최신 Desugaring이 안정적으로 변환됩니다.
            command.addAll(["--min-api", "26", "--output", "build/libs/${projectName}Android.jar", "build/libs/${projectName}Desktop.jar"])
            
            commandLine command
        }
    }
}

jar{
    dependsOn "generateModMetadata"
    archiveFileName = "${project.name}Desktop.jar"

    from{
        configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) }
    }

    from(generatedModMetadata)

    from("assets/"){
        include "**"
    }
}

tasks.register('deploy', Jar) {
    def projectName = project.name
    dependsOn jarAndroid
    dependsOn jar
    archiveFileName = "${projectName}.jar"

    // Desktop.jar 와 Android.jar(classes.dex 포함)를 하나의 jar로 합칩니다.
    from { [zipTree("build/libs/${projectName}Desktop.jar"), zipTree("build/libs/${projectName}Android.jar")] }

    doLast {
        delete "build/libs/${projectName}Android.jar"
    }
}
